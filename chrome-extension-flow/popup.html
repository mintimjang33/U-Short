<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 280px; font-family: system-ui, sans-serif; padding: 14px; }
    h3 { margin: 0 0 10px; font-size: 14px; }
    label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; margin-bottom: 6px; }
    button { width: 100%; padding: 8px; cursor: pointer; }
    #status { margin-top: 8px; font-size: 12px; }
  </style>
</head>
<body>
  <h3>유쇼츠 Google Flow 연동</h3>
  <label>API 주소</label>
  <input id="apiBase" placeholder="https://u-short-beige.vercel.app" />
  <label>연동 토큰</label>
  <input id="token" placeholder="app_config의 FLOW_EXTENSION_TOKEN 값" />
  <label>Flow 프로젝트 URL</label>
  <input id="flowProjectUrl" placeholder="labs.google/fx/tools/flow/project/..." />
  <button id="save">저장 및 연결 확인</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
